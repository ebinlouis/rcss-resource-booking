<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RCSS Resource Booking</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #fcfcfd 0%, #f8fafc 100%);
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #startup-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
        font-family: "Geist", Arial, sans-serif;
      }

      .cards-stack {
        position: relative;
        width: 280px;
        height: 180px;
        margin-bottom: 40px;
      }

      .booking-card {
        position: absolute;
        width: 220px;
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 12px 40px rgba(15, 23, 42, 0.08),
          0 4px 12px rgba(15, 23, 42, 0.05);
        color: #0f172a;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(40px) scale(0.96);
        animation: floatIn 2.4s infinite ease-in-out;
      }

      .booking-card span {
        display: block;
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
        margin-top: 6px;
      }

      .card-1 {
        left: 0;
        top: 60px;
        animation-delay: 0s;
      }

      .card-2 {
        left: 30px;
        top: 30px;
        animation-delay: 0.35s;
      }

      .card-3 {
        left: 60px;
        top: 0;
        animation-delay: 0.7s;
      }

      .loader-text {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.03em;
      }

      .loader-subtext {
        margin-top: 10px;
        font-size: 14px;
        color: #64748b;
      }

      @keyframes floatIn {
        0% {
          opacity: 0;
          transform: translateY(35px) scale(0.95);
        }

        20% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }

        70% {
          opacity: 1;
          transform: translateY(-4px) scale(1);
        }

        100% {
          opacity: 0;
          transform: translateY(-18px) scale(0.98);
        }
      }
    </style>

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="startup-loader">
      <div class="cards-stack">
        <div class="booking-card card-1">
          Hall Booking
          <span>Preparing venue access</span>
        </div>

        <div class="booking-card card-2">
          Lab Access
          <span>Syncing availability</span>
        </div>

        <div class="booking-card card-3">
          Classroom
          <span>Loading schedules</span>
        </div>
      </div>

      <div class="loader-text">Please Wait</div>
      <div class="loader-subtext">Getting everything ready for you</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
